name: Test Suite
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup@v1
        with:
          components: clippy
      - name: Run tests
        run: cargo test --workspace
  doc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup@v1
      - name: Check documentation
        run: cargo doc --no-deps --all-features
